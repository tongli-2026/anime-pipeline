[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-pipeline"
version = "0.1.0"
description = "Cost-aware human-in-the-loop AI anime generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "aiofiles>=23.2.1",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    # Image generation
    "fal-client>=0.5.0",
    "replicate>=0.25.0",
    "Pillow>=10.3.0",
    # TTS
    "openai>=1.30.0",
    "elevenlabs>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "hatchling>=1.25.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
anime-pipeline = "anime_pipeline.main:main"
anime-pipeline-shot = "anime_pipeline.shot_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["anime_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # Long prompt strings are intentionally kept readable as authored.

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
